name: Cross-platform CI/CD

on:
  push:
    branches: [feature/Traditional_Orders]
  pull_request:
    branches: [feature/Traditional_Orders]

jobs:
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          npm install -g yarn
          yarn install

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: yarn install

      - name: Run linter
        run: yarn lint

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: yarn install

      - name: Install Jest (nếu chưa có)
        run: yarn add --dev jest

      - name: Run tests
        run: yarn test

  build_android:
    name: Build Android App
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Android
        run: |
          cd android
          ./gradlew assembleRelease